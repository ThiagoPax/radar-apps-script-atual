name: Verify Radar historical recovery
on:
  pull_request:
  push:
    branches:
      - fix/radar-reprocess-transcript-20261015

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Apps Script JavaScript syntax
        run: |
          node --check apps-script-atual/12_Speech_Integration_GE.js
          node --check apps-script-atual/99_Menu_Triggers_GE.js
