name: Verify morning rollover formulas
on:
  push:
  pull_request:
jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node --check apps-script-atual/30_Historico_GE.js
          node tests/morning-rollover.cjs apps-script-atual/30_Historico_GE.js
